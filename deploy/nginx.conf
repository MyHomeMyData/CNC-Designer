# CNC-Designer is a static single-page app without a backend.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must always be fresh so that updates are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built assets carry a content hash in their name and never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
